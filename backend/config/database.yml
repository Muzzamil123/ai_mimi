# PostgreSQL configuration. All connection details are environment-driven so the
# same file works for local host runs, Docker Compose, CI, and production.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", nil) %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", nil) %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "aicvp_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME_TEST", "aicvp_test") %>

# In production, DATABASE_URL (if present) is automatically merged on top of
# these discrete values by Rails, so it does not need to be listed here.
production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "aicvp_production") %>
