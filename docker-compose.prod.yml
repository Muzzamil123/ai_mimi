name: aicvp-prod

# Production stack (single-host reference deployment): Rails API + Sidekiq worker
# from the production image, PostgreSQL, Redis, and the React SPA served by nginx
# (which also reverse-proxies /api to the API — same-origin, no CORS).
#
# Secrets/config come from an operator-provided .env.production (never committed;
# see .env.example and docs/operations/deployment.md). For real production,
# prefer managed Postgres/Redis/object-storage and a container platform; this
# compose is a faithful, runnable reference of the topology.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

x-backend-env: &backend_env
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "1"
  RAILS_SERVE_STATIC_FILES: "1"
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set in .env.production}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: ${DATABASE_USERNAME:?}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
  DATABASE_NAME: ${DATABASE_NAME:?}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:?}
  FRONTEND_URL: ${FRONTEND_URL:?}
  API_PUBLIC_URL: ${API_PUBLIC_URL:?}
  JWT_SECRET: ${JWT_SECRET:?}
  AR_ENCRYPTION_PRIMARY_KEY: ${AR_ENCRYPTION_PRIMARY_KEY:?}
  AR_ENCRYPTION_DETERMINISTIC_KEY: ${AR_ENCRYPTION_DETERMINISTIC_KEY:?}
  AR_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_ENCRYPTION_KEY_DERIVATION_SALT:?}
  # Providers + storage + email (see .env.example / deployment guide).
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
  MAIL_FROM: ${MAIL_FROM:-}
  CHARACTER_IMAGE_PROVIDER: ${CHARACTER_IMAGE_PROVIDER:-}
  TEXT_GENERATION_PROVIDER: ${TEXT_GENERATION_PROVIDER:-}
  SPEECH_TO_TEXT_PROVIDER: ${SPEECH_TO_TEXT_PROVIDER:-}
  VIDEO_GENERATION_PROVIDER: ${VIDEO_GENERATION_PROVIDER:-}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?}
      POSTGRES_DB: ${DATABASE_NAME:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"] # persist queued jobs
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend_env
    # The image entrypoint runs db:prepare (migrations) before the server starts.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/v1/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq"]
    environment: *backend_env
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
