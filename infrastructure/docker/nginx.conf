# Production nginx for the React SPA. Serves the static bundle with an SPA
# fallback, long-caches hashed assets, and reverse-proxies the API (same-origin,
# so the browser makes no cross-origin calls and CORS is a non-issue).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Container health probe.
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Reverse-proxy the Rails API. Docker DNS resolves the `api` service; the
  # variable + resolver avoids nginx failing to start if the API is not up yet.
  resolver 127.0.0.11 valid=30s;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 25m; # allow spoken-idea audio uploads
  }

  # Hashed build assets are immutable — cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every other path serves index.html (client-side routing).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
